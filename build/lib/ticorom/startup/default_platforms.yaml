# TicoRom platform map.
#
# This file is the only place that decides which RomM platforms are published.
# Keys under "platforms" are RomM folder names (fs_slug). A platform that is in
# neither "platforms" nor "exclude" is not published, and TicoRom warns about it.
#
# tico_slug   tico's ROM folder name; also the console tag for the shelf
# install     where games go on the SD card (default: tico/roms/<tico_slug>)
# extensions  what tico's emulator for that console loads; other files are skipped
# chd_types   CHD variants that launch (cd, gd, dvd); others are skipped
# enabled     set to false to stop publishing a platform but keep its entry

defaults:
  zip_policy: keep      # keep = deliver archives whole; tico's cartridge emulators open them
  multi_file: bundle

# RomM platforms that are deliberately not published (no tico console for them).
exclude: [nintendo-dsi, ps3, switch, xbox, xbox360]

platforms:
  3ds:
    tico_slug: 3ds
    extensions: [3ds, cci, cxi, app, 3dsx, elf, axf, zcci, zcxi, z3dsx]

  dc:
    tico_slug: dc
    extensions: [chd, gdi, cdi, cue, m3u]
    companion_extensions: [bin, raw]

  gamegear:
    tico_slug: game-gear
    extensions: [gg, bin, zip, 7z, rar]

  gb:
    tico_slug: gb
    extensions: [gb, gbc, zip, 7z, rar]

  gba:
    tico_slug: gba
    extensions: [gba, gb, gbc, sgb, zip, 7z, rar]

  gbc:
    tico_slug: gbc
    extensions: [gbc, gb, zip, 7z, rar]

  genesis:
    tico_slug: genesis
    extensions: [md, gen, bin, smd, zip, 7z, rar]

  n64:
    tico_slug: n64
    extensions: [z64, n64, v64, zip, 7z, rar]

  nds:
    tico_slug: nds
    extensions: [nds, zip, 7z, rar]

  nes:
    tico_slug: nes
    extensions: [nes, unf, unif, fds, zip, 7z, rar]

  ngc:
    tico_slug: gc
    extensions: [rvz, iso, gcm, gcz, ciso, wia, wbfs, m3u]

  ps2:
    tico_slug: ps2
    extensions: [chd, iso, cso, zso]
    chd_types: [cd]     # a DVD-type CHD installed but did not launch

  psx:
    tico_slug: psx
    extensions: [chd, cue, iso, pbp, ecm, m3u]
    companion_extensions: [bin]

  snes:
    tico_slug: snes
    extensions: [sfc, smc, fig, swc, bs, st, zip, 7z, rar]

  wii:
    tico_slug: wii
    extensions: [rvz, wbfs, iso, gcz, ciso, wia, gcm, wad, m3u]
