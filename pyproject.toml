[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticorom"
version = "0.1.0"
description = "Publishes a RomM library as a tico Store repository"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ticorom = "ticorom.startup.start:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticorom = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
