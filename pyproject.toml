[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[project]
name = "ticorom"
version = "0.1.0"
description = "Publishes a RomM library as a tico Store repository"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ticorom = "ticorom.startup.start:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
